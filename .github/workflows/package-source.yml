name: Package S.O.S Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'docs/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'README.md'
      - '.gitignore'
      - 'AUDITORIA-OUTRA-IA.md'
      - '.github/workflows/build-portable-windows.yml'
      - '.github/workflows/package-source.yml'

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source ZIP
        run: |
          zip -r SOS-Engenharia-Auditoria-Completa.zip \
            src src-tauri docs public scripts \
            package.json tsconfig.json vite.config.ts index.html README.md .gitignore AUDITORIA-OUTRA-IA.md \
            .github/workflows/build-portable-windows.yml \
            .github/workflows/package-source.yml \
            -x 'src-tauri/target/*' 'node_modules/*' 'dist/*' '*.log'

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Engenharia-Auditoria-Completa
          path: SOS-Engenharia-Auditoria-Completa.zip
          if-no-files-found: error
